[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustverify"
version = "1.0.0"
description = "Executable verification of structured AI-generated data analysis"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "BAHODIR KODIRJON UGLI NAZAROV"}]
dependencies = []

[project.scripts]
trustverify = "trustverify.cli:main"

[tool.setuptools.packages.find]
include = ["trustverify*"]
